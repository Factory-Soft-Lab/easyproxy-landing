# El plan de Pro: uno solo, mensual de USD 3, igual en las dos apps y en las dos tiendas.
#   iOS      App/Services/StoreKitEntitlement.swift  (com.fabtory.easyproxy.pro.monthly)
#   Android  app/…/features/pro/PlayStore.kt         (com.fabtory.easyproxy.pro.monthly)
#
# `price_usd` es el precio de referencia en dólares; el precio final en cada moneda lo fija
# cada tienda por país y la app lo enseña antes de pagar.
#
# `trial_days` es la prueba gratis que se configura en App Store Connect y en
# Play Console. Si allí cambia, cambia aquí.

- id: pro.monthly
  renews: true
  trial_days: 3
  price_usd: 3
  es: { name: "Mensual", period: "Un mes, USD 3" }
  en: { name: "Monthly", period: "One month, USD 3" }
